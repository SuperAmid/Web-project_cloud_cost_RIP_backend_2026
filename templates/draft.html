{{ define "draft.html" }}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="page-draft">
  <!-- Экран телефона: на компьютере показывается рамкой, на телефоне — во весь экран -->
  <div class="phone">
  {{ template "statusbar" . }}
  <main class="phone-shell">

    <!-- ---------- Шапка страницы ---------- -->
    <header class="page-header">
      <p class="eyebrow">Черновик · ЛР2</p>
      <h1>Добавление</h1>
    </header>

    {{ if .Error }}
      <p class="form-error">{{ .Error }}</p>
    {{ end }}

    {{ if .ProviderRouter }}
      <!-- ========== Шаг 2: черновик есть — «Опубликовать» ========== -->
      <form class="provider_router_form" method="post" action="/provider_routers/draft/publish">

        <!-- Фото и видео черновика (если файлов нет — по умолчанию с SSR-сервера) -->
        <fieldset class="form-group">
          <legend>Фото и видео</legend>
          <img class="media-preview" src="{{ .ProviderRouter.ImageURL }}" alt="Фото маршрутизатора">
          <video class="media-preview" src="{{ .ProviderRouter.VideoURL }}" poster="{{ .ProviderRouter.ImageURL }}" muted loop autoplay playsinline controls></video>
        </fieldset>

        <!-- Название уже задано на шаге «Далее», ниже — краткое описание и два поля по теме -->
        <fieldset class="form-group">
          <legend>Информация</legend>
          <p class="draft-name">{{ .ProviderRouter.Name }}</p>

          <label>Краткое описание
            <textarea name="description" maxlength="500" required placeholder="Например, конечный маршрутизатор жилого комплекса">{{ .ProviderRouter.Description }}</textarea>
          </label>

          <label>Пропускная способность, Мбит/с
            <input name="bandwidthMbps" type="number" min="1" required
                   value="{{ if .ProviderRouter.BandwidthMbps }}{{ .ProviderRouter.BandwidthMbps }}{{ end }}">
          </label>

          <label>Стоимость, ₽
            <input name="costRub" type="number" min="1" required
                   value="{{ if .ProviderRouter.CostRub }}{{ .ProviderRouter.CostRub }}{{ end }}">
          </label>
        </fieldset>

        <button class="action-button" type="submit">Опубликовать</button>
      </form>
    {{ else }}
      <!-- ========== Шаг 1: черновика нет — три поля и «Далее» ========== -->
      <form class="provider_router_form" method="post" action="/provider_routers/draft/create">

        <!-- Фото и видео: показаны файлы по умолчанию, выбор из проводника.
             У полей нет name — по заданию ЛР2 файлы на сервер не передаются. -->
        <fieldset class="form-group">
          <legend>Фото и видео</legend>
          <label>Фото
            <img class="media-preview" src="{{ .DefaultImageURL }}" alt="Фото по умолчанию">
            <input type="file" accept="image/*">
          </label>
          <label>Видео
            <video class="media-preview" src="{{ .DefaultVideoURL }}" poster="{{ .DefaultImageURL }}" muted loop autoplay playsinline controls></video>
            <input type="file" accept="video/*">
          </label>
        </fieldset>

        <fieldset class="form-group">
          <legend>Информация</legend>
          <label>Название маршрутизатора
            <input name="name" maxlength="120" required placeholder="Например, Ozerki Residence Gateway">
          </label>
        </fieldset>

        <button class="action-button" type="submit">Далее</button>
      </form>
    {{ end }}
  </main>

  {{ template "nav" . }}
  </div>
</body>
</html>
{{ end }}
