{{define "draft.html"}}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="phone-shell form-page">
        <header class="page-header">
            <p class="eyebrow">Черновик · не сохраняется</p>
            <h1>Добавление маршрутизатора</h1>
            <p>Интерфейс будущей карточки сети. В ЛР1 данные не отправляются на сервер.</p>
        </header>

        <form class="router-form">
            <img class="draft-image" src="{{.Router.ImageURL}}" alt="{{.Router.Name}}">

            <label>Название
                <input value="{{.Router.Name}}">
            </label>

            <label>Описание
                <textarea>{{.Router.Description}}</textarea>
            </label>

            <label>Image key
                <input value="{{.Router.ImageKey}}">
            </label>

            <label>Video key
                <input value="{{.Router.VideoKey}}">
            </label>

            <label>Тип маршрутизатора
                <select>
                    <option selected>{{.Router.RouterType}}</option>
                    <option>central</option>
                    <option>intermediate</option>
                    <option>residential</option>
                </select>
            </label>

            <label>Пропускная способность, Мбит/с
                <input type="number" value="{{.Router.ThroughputMbps}}">
            </label>

            <label>Энергопотребление, Вт
                <input type="number" value="{{.Router.PowerConsumptionW}}">
            </label>

            <label>Количество портов
                <input type="number" value="{{.Router.PortCount}}">
            </label>

            <label>Расположение
                <input value="{{.Router.Location}}">
            </label>

            <label>Мастер-маршрутизатор
                <input value="{{.Router.MasterRouterName}}">
            </label>

            <p class="form-hint">Поля доступны только для визуального ввода: POST и сохранение намеренно отсутствуют.</p>
        </form>
    </main>

    {{template "nav" .}}
</body>
</html>
{{end}}
