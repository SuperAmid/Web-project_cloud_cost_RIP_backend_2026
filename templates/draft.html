{{define "draft.html"}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

  <main class="phone-shell">

    <!-- ---------- Шапка страницы ---------- -->
    <header class="page-header">
      <p class="eyebrow">Черновик · ЛР1</p>
      <h1>Добавление</h1>
      <p>Выбор фото и видео доступен только в форме. В ЛР1 файлы и данные не отправляются на сервер.</p>
    </header>

    <!-- ---------- Форма добавления ---------- -->
    <form class="router-form">

      <!-- Загрузка фото -->
      <label>Фото
        <input type="file" accept="image/*">
        <small>По умолчанию: изображение из MinIO по ключу <code>{{.ProviderRouter.ImageKey}}</code>.</small>
      </label>

      <!-- Загрузка видео -->
      <label>Видео
        <input type="file" accept="video/*">
        <small>По умолчанию: короткое видео из MinIO по ключу <code>{{.ProviderRouter.VideoKey}}</code>.</small>
      </label>

      <!-- Название маршрутизатора -->
      <label>Название маршрутизатора
        <input value="{{.ProviderRouter.Name}}">
      </label>

      <!-- Пропускная способность -->
      <label>Пропускная способность, Мбит/с
        <input type="number" value="{{.ProviderRouter.BandwidthMbps}}">
      </label>

      <!-- Стоимость -->
      <label>Стоимость, ₽
        <input type="number" value="{{.ProviderRouter.CostRub}}">
      </label>

      <!-- Кнопка перехода далее -->
      <button class="action-button" type="button">Далее</button>

      <!-- Подсказка о поведении кнопки -->
      <p class="form-hint">Кнопка не создаёт запись: POST и сохранение относятся к ЛР2.</p>

    </form>
  </main>

  <!-- ---------- Нижняя навигация ---------- -->
  {{template "nav" .}}

</body>
</html>
{{end}}
