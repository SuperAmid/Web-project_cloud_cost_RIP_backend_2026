{{define "draft.html"}}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="phone-shell form-page">
        <header class="page-header">
            <p class="eyebrow">Черновик · не сохраняется</p>
            <h1>Добавление маршрутизатора</h1>
            <p>Интерфейс будущей карточки сети. В ЛР1 данные не отправляются на сервер.</p>
        </header>

        <form class="router-form">
            <section class="media-pickers">
                <div class="media-picker">
                    <p class="picker-label">Фото</p>
                    <img class="picker-preview" src="{{.Router.ImageURL}}" alt="Фото по умолчанию: {{.Router.ImageKey}}">
                    <label class="file-button">
                        Выбрать фото
                        <input type="file" name="photo" accept="image/*">
                    </label>
                </div>

                <div class="media-picker">
                    <p class="picker-label">Видео</p>
                    <video class="picker-preview" src="{{.Router.VideoURL}}" muted playsinline controls preload="metadata"></video>
                    <label class="file-button">
                        Выбрать видео
                        <input type="file" name="video" accept="video/*">
                    </label>
                </div>
            </section>

            <label>Название
                <input value="{{.Router.Name}}">
            </label>

            <label>Энергопотребление, Вт
                <input type="number" value="{{.Router.PowerConsumptionW}}">
            </label>

            <p class="form-hint">Поля доступны только для визуального ввода: POST и сохранение намеренно отсутствуют.</p>

            <button type="submit" class="submit-button">Далее <span>→</span></button>
        </form>
    </main>

    {{template "nav" .}}
</body>
</html>
{{end}}
