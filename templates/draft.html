{{define "draft.html"}}<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Добавление маршрутизатора</title><link rel="stylesheet" href="/static/styles.css"></head><body><main class="phone-shell form-page"><header class="page-header"><p class="eyebrow">Черновик маршрутизатора</p><h1>Добавление</h1><p>В ЛР2 новые фото и видео не передаются на сервер: применяется медиа по умолчанию.</p></header>{{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}{{if .Router}}<form class="router-form" method="post" action="/routers/draft/publish"><img class="draft-image" src="{{.Router.ImageURL}}" alt="{{.Router.Name}}"><label>Название<input value="{{.Router.Name}}" disabled></label><label>Описание<textarea name="description">{{.Router.Description}}</textarea></label><label>Image URL<input value="{{.Router.ImageURL}}" disabled></label><label>Video URL<input value="{{.Router.VideoURL}}" disabled></label><label>Тип маршрутизатора<select name="routerType"><option {{if eq .Router.RouterType "central"}}selected{{end}}>central</option><option {{if eq .Router.RouterType "intermediate"}}selected{{end}}>intermediate</option><option {{if eq .Router.RouterType "residential"}}selected{{end}}>residential</option></select></label><label>Пропускная способность, Мбит/с<input name="throughputMbps" type="number" min="0" value="{{.Router.ThroughputMbps}}"></label><label>Энергопотребление, Вт<input name="powerConsumptionW" type="number" min="0" value="{{.Router.PowerConsumptionW}}"></label><label>Количество портов<input name="portCount" type="number" min="0" value="{{.Router.PortCount}}"></label><label>Расположение<input name="location" value="{{.Router.Location}}"></label><label>Мастер-маршрутизатор<input name="masterRouterName" value="{{.Router.MasterRouterName}}"></label><button class="submit-button" type="submit">Опубликовать</button></form>{{else}}<form class="router-form" method="post" action="/routers/draft/create"><img class="draft-image" src="/media/routers/draft.svg" alt="Маршрутизатор по умолчанию"><label>Название маршрутизатора<input name="name" required placeholder="Например, Almaty Residence Gateway"></label><label>Изображение<input placeholder="В ЛР2 — медиа по умолчанию" disabled></label><label>Видео<input placeholder="В ЛР2 — медиа по умолчанию" disabled></label><button class="submit-button" type="submit">Далее</button></form>{{end}}</main>{{template "nav" .}}</body></html>{{end}}
