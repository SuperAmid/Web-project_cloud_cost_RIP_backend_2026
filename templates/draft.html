{{define "draft.html"}}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="page-draft">
  <!-- Экран телефона: на компьютере показывается рамкой, на телефоне — во весь экран -->
  <div class="phone">
  {{ template "statusbar" . }}

  <main class="phone-shell">

    <!-- ---------- Шапка страницы ---------- -->
    <header class="page-header">
      <p class="eyebrow">Черновик · ЛР1</p>
      <h1>Добавление</h1>
      <p>Поля можно заполнить, но в ЛР1 данные и файлы на сервер не отправляются.</p>
    </header>

    <!-- ---------- Форма добавления ---------- -->
    <form class="provider_router_form">

      <!-- Группа 1: медиа сверху, друг под другом -->
      <fieldset class="form-group">
        <legend>Фото и видео</legend>

        <!-- Фото: превью по умолчанию из MinIO и выбор файла из проводника -->
        <label>Фото
          <img class="media-preview" src="{{.ProviderRouter.ImageURL}}" alt="Фото по умолчанию">
          <input type="file" accept="image/*">
          <small>По умолчанию показано изображение черновика: <code>{{.ProviderRouter.ImageKey}}</code></small>
        </label>

        <!-- Видео: превью по умолчанию из MinIO и выбор файла из проводника -->
        <label>Видео
          <video class="media-preview" src="{{.ProviderRouter.VideoURL}}" poster="{{.ProviderRouter.ImageURL}}" muted loop autoplay playsinline controls></video>
          <input type="file" accept="video/*">
          <small>По умолчанию показано видео черновика: <code>{{.ProviderRouter.VideoKey}}</code></small>
        </label>
      </fieldset>

      <!-- Группа 2: текст и два поля по теме -->
      <fieldset class="form-group">
        <legend>Информация</legend>

        <!-- Название маршрутизатора -->
        <label>Название маршрутизатора
          <input value="{{.ProviderRouter.Name}}">
        </label>

        <!-- Пропускная способность -->
        <label>Пропускная способность, Мбит/с
          <input type="number" value="{{.ProviderRouter.BandwidthMbps}}">
        </label>

        <!-- Стоимость -->
        <label>Стоимость, ₽
          <input type="number" value="{{.ProviderRouter.CostRub}}">
        </label>
      </fieldset>

      <!-- Кнопка перехода далее: в ЛР1 ничего не отправляет -->
      <button class="action-button" type="button">Далее</button>

      <!-- Подсказка о поведении кнопки -->
      <p class="form-hint">Кнопка не создаёт запись: POST и сохранение относятся к ЛР2.</p>

    </form>
  </main>

  <!-- ---------- Нижняя навигация ---------- -->
  {{template "nav" .}}
  </div>

</body>
</html>
{{end}}
