{{define "grid.html"}}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="phone-shell grid-page">
        <header class="page-header">
            <p class="eyebrow">Сеть провайдера</p>
            <h1>Маршрутизаторы</h1>
            <p>Опубликованные узлы без удалённых устройств.</p>
        </header>

        <form class="filter-form" method="get" action="/routers">
            <label for="throughput">Мин. пропускная способность, Мбит/с</label>
            <div>
                <input id="throughput"
                       name="minThroughputMbps"
                       type="number"
                       min="0"
                       inputmode="numeric"
                       value="{{.MinThroughput}}"
                       placeholder="Например, 10000">
                <button type="submit">Фильтр</button>
            </div>
        </form>

        <section class="router-grid" aria-label="Плитка маршрутизаторов">
            {{range .Routers}}
                <a class="router-tile" href="/routers/feed?id={{.ID}}">
                    <img src="{{.ImageURL}}" alt="{{.Name}}">
                    <div>
                        <p class="tile-type">{{.RouterType}}</p>
                        <h2>{{.Name}}</h2>
                        <p>{{.ThroughputMbps}} Мбит/с</p>
                        <span>♥ {{.Likes}}</span>
                    </div>
                </a>
            {{else}}
                <p class="empty-state">Маршрутизаторы с таким порогом не найдены.</p>
            {{end}}
        </section>
    </main>

    {{template "nav" .}}
</body>
</html>
{{end}}
