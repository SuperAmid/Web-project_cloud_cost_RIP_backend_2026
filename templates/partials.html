{{define "statusbar"}}
<!-- ---------- Строка состояния телефона: время, камера, сеть и заряд ---------- -->
<div class="status-bar" aria-hidden="true">
  <span class="sb-time">{{ clock }}</span>
  <span class="sb-camera"></span>
  <span class="sb-icons">
    <svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg viewBox="0 0 16 12"><path d="M8 11.5 1 4.3a10 10 0 0 1 14 0z"/></svg>
    <span class="sb-battery"><span class="sb-level"></span></span>
    <span class="sb-percent">87%</span>
  </span>
</div>
{{end}}
