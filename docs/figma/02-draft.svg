<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <!-- Добавление: сверху фото и видео по умолчанию с выбором файла, ниже текст и два поля по теме -->
  <rect width="390" height="844" fill="#F5F5F5"/>
  <text x="16" y="34" font-family="Arial" font-size="12" font-weight="bold" fill="#7700FF">ЧЕРНОВИК · ЛР1</text>
