    <rect x="12" y="466" width="366" height="228" rx="7" fill="#FFF" stroke="#B9B9B9"/>
    <text x="24" y="486" font-size="11" font-weight="bold" fill="#7700FF">ИНФОРМАЦИЯ</text>
