  <text x="49" y="814" font-family="Arial" font-size="13" font-weight="bold" fill="#FFF">Лента</text><text x="158" y="814" font-family="Arial" font-size="13" font-weight="bold" fill="#FFF">Добавление</text><text x="268" y="814" font-family="Arial" font-size="13" font-weight="bold" fill="#FFF">Маршрутизаторы</text>
