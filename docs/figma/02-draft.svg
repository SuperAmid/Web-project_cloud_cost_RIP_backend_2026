    <text x="24" y="296" font-size="13" font-weight="bold">Видео</text>
    <rect x="24" y="304" width="342" height="104" rx="5" fill="#222"/>
    <path d="M186 342l22 14-22 14z" fill="#FFF"/>
    <rect x="24" y="414" width="342" height="30" rx="4" fill="#FFF" stroke="#B9B9B9"/>
