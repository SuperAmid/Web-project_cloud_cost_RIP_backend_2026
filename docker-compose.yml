name: provider-router

services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    volumes:
      - ./assets:/assets:ro
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/provider-media;
      mc anonymous set download local/provider-media;
      mc cp --recursive /assets/provider-media/ local/provider-media/;
      mc anonymous set download local/provider-media;
      exit 0
      "

volumes:
  minio-data: